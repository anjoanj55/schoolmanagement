<!-- Overlay Loader (no DOM destruction) -->
<div class="overlay" *ngIf="isBlurred">
  <!-- Optional loading bar -->
</div>

<div [class.blurred]="isBlurred">
  <div class="tab-content">
    <!-- Loader -->
    <div *ngIf="isLoading" class="spinner-container">
      <mat-spinner></mat-spinner>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <!-- Power BI Container (no iframe border issue) -->
    <div *ngIf="embedConfig && !isLoading" class="report-container">
      <div id="powerbi-container" class="responsive-container"></div>
    </div>
  </div>
</div>
