<h2 mat-dialog-title 
    style="font-size:22px; font-weight:600; margin:0 0 20px 0; color:#2c3e50; text-align:center;">
  Subject Details
</h2>

<mat-dialog-content 
  style="
    font-size:15px; 
    line-height:1.6; 
    color:#444; 
    padding:0 20px; 
    flex:1; 
    max-height:60vh; 
    overflow-y:auto; 
    scrollbar-width:none; 
    -ms-overflow-style:none;
  "
  class="responsive-dialog-content">

  <div style=" flex-direction:column; gap:16px; width:100%;">

    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px; color:#2c3e50;">Subject Name</label>
      <input type="text" [value]="data.subject_name" readonly
             style="padding:10px; border:none; border-bottom:2px solid #1976d2; background:#f9f9f9; border-radius:4px; font-size:14px; width:100%;">
    </div>

    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px; color:#2c3e50;">Subject Code</label>
      <input type="text" [value]="data.subject_code" readonly
             style="padding:10px; border:none; border-bottom:2px solid #1976d2; background:#f9f9f9; border-radius:4px; font-size:14px; width:100%;">
    </div>

    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px; color:#2c3e50;">Grade</label>
      <input type="text" [value]="data.class_names" readonly
             style="padding:10px; border:none; border-bottom:2px solid #1976d2; background:#f9f9f9; border-radius:4px; font-size:14px; width:100%;">
    </div>

    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px; color:#2c3e50;">Hours/Week</label>
      <input type="text" [value]="data.total_hours_per_week" readonly
             style="padding:10px; border:none; border-bottom:2px solid #1976d2; background:#f9f9f9; border-radius:4px; font-size:14px; width:100%;">
    </div>

    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px; color:#2c3e50;">Teacher</label>
      <input type="text" [value]="data.first_name + ' ' + data.last_name" readonly
             style="padding:10px; border:none; border-bottom:2px solid #1976d2; background:#f9f9f9; border-radius:4px; font-size:14px; width:100%;">
    </div>

    <div style="display:flex; flex-direction:column;">
      <label style="font-weight:600; margin-bottom:4px; color:#2c3e50;">Students</label>
      <input type="text" [value]="data.studentcount" readonly
             style="padding:10px; border:none; border-bottom:2px solid #1976d2; background:#f9f9f9; border-radius:4px; font-size:14px; width:100%;">
    </div>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" 
  style="padding:10px; border-top:1px solid #eee; text-align:right; flex-shrink:0; background:#fff; position:sticky; bottom:0;">
  <button mat-button mat-dialog-close 
          style="background:#1976d2; color:#fff; padding:8px 18px; border-radius:6px; font-size:14px; min-width:80px;">
    Close
  </button>
</mat-dialog-actions>
